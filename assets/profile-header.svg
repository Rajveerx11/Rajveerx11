<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc">
  <title id="title">Rajveer Vadnal — Agentic AI Systems Engineer</title>
  <desc id="desc">Header banner highlighting Rajveer Vadnal as an Agentic AI Systems Engineer building verifiable agents, MCP infrastructure, and local-first AI systems.</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1522"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a28" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a1019" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.85" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .motion { visibility: hidden; }
      @media (prefers-reduced-motion: no-preference) { 
        .motion { visibility: visible; } 
      }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="1.5" y="1.5" width="857" height="297" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="857" height="297" rx="16" fill="url(#dotGrid)"/>

  <!-- Top Accent Beam -->
  <line x1="40" y1="1.5" x2="820" y2="1.5" stroke="url(#cyanEmerald)" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Window Header / Controls -->
  <circle cx="32" cy="22" r="5" fill="#f87171" fill-opacity="0.85"/>
  <circle cx="48" cy="22" r="5" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="64" cy="22" r="5" fill="#34d399" fill-opacity="0.85"/>
  
  <text x="430" y="26" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11.5" letter-spacing="0.5">
    rajveer@agent-node:~$ ./orchestrate --role="Agentic Systems Engineer"
  </text>
  <line x1="1.5" y1="38" x2="858.5" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= TOP CENTER ROLE HIGHLIGHT ================= -->
  <!-- Central Role Badge -->
  <g transform="translate(430, 72)">
    <!-- Badge Background -->
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#0c1929" fill-opacity="0.9"/>
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="none" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    
    <!-- Animated Badge Glow Dot -->
    <circle cx="-144" cy="0" r="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
    <g class="motion">
      <circle cx="-144" cy="0" r="3.5" fill="#38bdf8" stroke="#38bdf8" stroke-width="1">
        <animate attributeName="r" values="3.5;7;3.5" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.9;0;0.9" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Centered Role Text -->
    <text x="6" y="4.5" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="2.2">
      ✦ AGENTIC AI SYSTEMS ENGINEER ✦
    </text>
  </g>

  <!-- Centered Primary Name -->
  <text x="430" y="132" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    Rajveer Vadnal
  </text>

  <!-- Centered Value Proposition Subtitle -->
  <text x="430" y="162" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="450" letter-spacing="0.2">
    Autonomous Agent Loops • Model Context Protocol (MCP) • Verifiable Execution &amp; Evals
  </text>

  <!-- Centered Live Availability Status Pill -->
  <g transform="translate(430, 192)">
    <rect x="-145" y="-11" width="290" height="22" rx="11" fill="#062e1e" fill-opacity="0.65" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="-126" cy="0" r="3.5" fill="#34d399" filter="url(#softGlow)"/>
    <g class="motion">
      <circle cx="-126" cy="0" r="3.5" fill="none" stroke="#34d399" stroke-width="1">
        <animate attributeName="r" values="3.5;7.5;3.5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="6" y="3.5" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" letter-spacing="1">
      OPEN FOR AGENTIC AI ROLES &amp; BUILDS
    </text>
  </g>

  <!-- ================= BOTTOM 3 PILLARS / SPECIFICATION TILES ================= -->
  <!-- Tile 1: Agent Systems & MCP -->
  <g transform="translate(36, 222)">
    <rect x="0" y="0" width="248" height="60" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="12" y="11" width="6" height="6" rx="1.5" fill="#38bdf8"/>
    <text x="26" y="18" fill="#38bdf8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="0.8">AGENT LOOPS &amp; MCP</text>
    <text x="12" y="36" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5">Custom Tool Orchestration</text>
    <text x="12" y="49" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="9.5">FastMCP • Tree-sitter • State</text>
  </g>

  <!-- Tile 2: Deterministic Evals & Verification -->
  <g transform="translate(306, 222)">
    <rect x="0" y="0" width="248" height="60" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="12" y="11" width="6" height="6" rx="1.5" fill="#34d399"/>
    <text x="26" y="18" fill="#34d399" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="0.8">VERIFIABLE AGENT EVALS</text>
    <text x="12" y="36" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5">Proof-of-Work Test Gate</text>
    <text x="12" y="49" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="9.5">Mutation Testing • Signed Logs</text>
  </g>

  <!-- Tile 3: Local-First AI & Systems Engineering -->
  <g transform="translate(576, 222)">
    <rect x="0" y="0" width="248" height="60" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
    <rect x="12" y="11" width="6" height="6" rx="1.5" fill="#a78bfa"/>
    <text x="26" y="18" fill="#a78bfa" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="0.8">LOCAL-FIRST RUNTIMES</text>
    <text x="12" y="36" fill="#cbd5e1" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5">Tessera AI Testing IDE</text>
    <text x="12" y="49" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="9.5">Rust • Tauri • Ollama • QLoRA</text>
  </g>

  <!-- Animated Bottom Scan Ray -->
  <g class="motion">
    <line x1="36" y1="298" x2="136" y2="298" stroke="url(#cyanEmerald)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;688 0;0 0" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>

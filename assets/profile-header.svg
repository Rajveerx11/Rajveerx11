<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" role="img" aria-labelledby="title desc">
  <title id="title">Rajveer Vadnal — Agentic Systems Engineer</title>
  <desc id="desc">Systems that can prove themselves. Verifiable agents, local-first AI, and developer infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111722"/>
      <stop offset="1" stop-color="#161e2e"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ed542e"/>
      <stop offset="0.5" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tile-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed542e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Panel Base -->
  <rect x="1.5" y="1.5" width="857" height="247" rx="16" fill="url(#bg)" stroke="#26334a" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="857" height="247" rx="16" fill="url(#dot-grid)"/>

  <!-- Animated Active Border Sweep -->
  <rect x="1.5" y="1.5" width="857" height="247" rx="16" fill="none" stroke="url(#brand-grad)" stroke-width="1.5" stroke-dasharray="90 2118" stroke-linecap="round" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-2208" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal Window Chrome Header -->
  <circle cx="26" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="5" fill="#febc2e"/>
  <circle cx="62" cy="22" r="5" fill="#28c840"/>

  <text x="88" y="26" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12">rajveer@neura:~$ ./verify --agentic-systems --live</text>

  <!-- Top-Right Live Status Pill -->
  <g transform="translate(686, 11)">
    <rect x="0" y="0" width="148" height="22" rx="11" fill="#161b22" stroke="#26334a" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="15" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">GATE: VERIFIED</text>
  </g>

  <line x1="1.5" y1="42" x2="858.5" y2="42" stroke="#26334a" stroke-width="1"/>

  <!-- Hero Identity Block -->
  <!-- Monogram Brand Tile -->
  <g transform="translate(36, 62)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#ed542e" fill-opacity="0.08" stroke="url(#tile-stroke)" stroke-width="2"/>
    <text x="40" y="52" text-anchor="middle" fill="#ed542e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="32" font-weight="800" letter-spacing="-0.5">RV</text>
  </g>

  <!-- Title & Credentials -->
  <g transform="translate(134, 62)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="224" height="19" rx="5" fill="#ed542e" fill-opacity="0.12" stroke="#ed542e" stroke-opacity="0.4" stroke-width="1"/>
    <text x="8" y="13.5" fill="#ed542e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.2">AGENTIC SYSTEMS ENGINEER</text>

    <!-- Name -->
    <text x="0" y="50" fill="#f0f6fc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="750">Rajveer Vadnal</text>

    <!-- Signature Motifs -->
    <text x="0" y="75" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.2">“Systems that can prove themselves.”</text>
    <text x="0" y="96" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5">Verifiable coding agents · Local-first intelligence · Developer infrastructure</text>
  </g>

  <!-- Verification Telemetry Panel -->
  <g transform="translate(606, 58)">
    <rect x="0" y="0" width="218" height="114" rx="10" fill="#0d1117" stroke="#26334a" stroke-width="1.2"/>

    <!-- Telemetry Header -->
    <text x="14" y="22" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">TELEMETRY GATES</text>
    <rect x="168" y="12" width="36" height="14" rx="4" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.4" stroke-width="1"/>
    <text x="186" y="22.5" text-anchor="middle" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="8.5" font-weight="700">PASS</text>

    <line x1="14" y1="32" x2="204" y2="32" stroke="#21262d" stroke-width="1"/>

    <!-- Telemetry Metric 1 -->
    <circle cx="20" cy="48" r="3" fill="#38bdf8"/>
    <text x="30" y="52" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">Test Re-runs</text>
    <text x="204" y="52" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">Deterministic</text>

    <!-- Telemetry Metric 2 -->
    <circle cx="20" cy="72" r="3" fill="#ed542e"/>
    <text x="30" y="76" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">Mutation Gate</text>
    <text x="204" y="76" text-anchor="end" fill="#ed542e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">Tamper-Proof</text>

    <!-- Telemetry Metric 3 -->
    <circle cx="20" cy="96" r="3" fill="#3fb950"/>
    <text x="30" y="100" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">Audit Log</text>
    <text x="204" y="100" text-anchor="end" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600">Ed25519</text>
  </g>

  <!-- Bottom Accent Divider Line -->
  <line x1="36" y1="192" x2="824" y2="192" stroke="url(#brand-grad)" stroke-width="1.5" opacity="0.75"/>

  <!-- Footer Technical Arsenal & Status -->
  <text x="36" y="222" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Python  ·  TypeScript  ·  Rust  ·  FastMCP  ·  Tauri  ·  Tree-sitter  ·  Ollama</text>

  <g transform="translate(824, 222)">
    <circle cx="-190" cy="-4" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="0" text-anchor="end" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="500">open to roles + freelance builds</text>
  </g>
</svg>

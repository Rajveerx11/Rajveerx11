<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 216" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace">
  <rect x="1.5" y="1.5" width="857" height="213" rx="14" fill="#0d1117" stroke="#26334a" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="857" height="213" rx="14" fill="none" stroke="#36bcf7" stroke-width="1.5" stroke-dasharray="80 2072" stroke-linecap="round" opacity="0.85"><animate attributeName="stroke-dashoffset" values="0;-2152" dur="9s" repeatCount="indefinite"/></rect>
  <rect x="30" y="30" width="44" height="44" rx="11" fill="#36bcf7" opacity="0.14"/><rect x="30" y="30" width="44" height="44" rx="11" fill="none" stroke="#36bcf7" stroke-width="1.5"/><text x="52" y="52.0" text-anchor="middle" dominant-baseline="central" fill="#36bcf7" font-size="23" font-weight="700">G</text>
  <circle cx="90" cy="52.0" r="3.5" fill="#36bcf7"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="102" y="52.0" dominant-baseline="central" fill="#e6edf3" font-size="18" font-weight="700">GFI Scout</text>
  <text x="34" y="92" font-size="12.5" fill="#8b949e">An MCP server + CLI that ranks good-first issues by <tspan fill="#e6edf3" font-weight="600">likelihood of contributor success</tspan> — not label alone.</text>
  <text x="34" y="114" font-size="12.5" fill="#8b949e">Scores repo health, maintainer response, merge rate, freshness and setup complexity; checks whether</text>
  <text x="34" y="136" font-size="12.5" fill="#8b949e">an issue is still available. Async GitHub API pipeline, TTL caching, strict typing and 100+ tests.</text>
  <text x="34" y="162" font-size="11" fill="#36bcf7" font-style="italic">◆ Also ships a terminal UI</text>
  <rect x="34" y="176" width="61" height="20" rx="6" fill="#3572A5" opacity="0.14"/><rect x="34" y="176" width="61" height="20" rx="6" fill="none" stroke="#3572A5" stroke-width="1" opacity="0.5"/><text x="64" y="190" text-anchor="middle" fill="#3572A5" font-size="10.5" font-weight="600">Python</text>
  <rect x="103" y="176" width="41" height="20" rx="6" fill="#8b949e" opacity="0.14"/><rect x="103" y="176" width="41" height="20" rx="6" fill="none" stroke="#8b949e" stroke-width="1" opacity="0.5"/><text x="124" y="190" text-anchor="middle" fill="#8b949e" font-size="10.5" font-weight="600">MCP</text>
  <rect x="152" y="176" width="89" height="20" rx="6" fill="#e6edf3" opacity="0.14"/><rect x="152" y="176" width="89" height="20" rx="6" fill="none" stroke="#e6edf3" stroke-width="1" opacity="0.5"/><text x="196" y="190" text-anchor="middle" fill="#e6edf3" font-size="10.5" font-weight="600">GitHub API</text>
  <rect x="249" y="176" width="68" height="20" rx="6" fill="#36bcf7" opacity="0.14"/><rect x="249" y="176" width="68" height="20" rx="6" fill="none" stroke="#36bcf7" stroke-width="1" opacity="0.5"/><text x="283" y="190" text-anchor="middle" fill="#36bcf7" font-size="10.5" font-weight="600">asyncio</text>
  <rect x="325" y="176" width="89" height="20" rx="6" fill="#3fb950" opacity="0.14"/><rect x="325" y="176" width="89" height="20" rx="6" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.5"/><text x="370" y="190" text-anchor="middle" fill="#3fb950" font-size="10.5" font-weight="600">100+ tests</text>
  <text x="830" y="52.0" text-anchor="end" dominant-baseline="central" fill="#36bcf7" font-size="16" font-weight="700">↗</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 875" role="img" aria-labelledby="title desc">
<title id="title">Published Proof-of-Work evaluation, with limitations</title>
<desc id="desc">60 runs on 20 tasks, one attempt per configuration. Codex and Copilot: 20 passed, 0 failed each. OpenCode: 17 passed, 3 failed. August 2026 recorded cohort, not a general agent ranking. Codex rows imported from eight days earlier. Token usage and exact cost unknown.</desc>
<rect x="1" y="1" width="428" height="873" rx="5" fill="#f1f2eb" stroke="#bac4b3"/>
<text x="25" y="37" fill="#20261f" font-size="23" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">An evaluation you can inspect</text>
<text x="25" y="64" fill="#515e4e" font-size="12" text-anchor="start" font-family="ui-monospace, Consolas, monospace">PROOF-OF-WORK / AUGUST 2026 COHORT</text>
<path d="M1 82H429" stroke="#bac4b3"/>
<text x="25" y="142" fill="#a83e1b" font-size="48" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">60</text>
<text x="101" y="123" fill="#20261f" font-size="18" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">recorded runs</text>
<text x="101" y="149" fill="#515e4e" font-size="15" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">20 tasks / 3 configurations</text>
<text x="25" y="188" fill="#515e4e" font-size="15" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">One attempt per task and configuration.</text>
<text x="25" y="210" fill="#515e4e" font-size="15" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">All outcomes retained.</text>
<text x="25" y="258" fill="#20261f" font-size="16" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Codex CLI 0.146.0</text>
<text x="25" y="280" fill="#515e4e" font-size="13" text-anchor="start" font-family="ui-monospace, Consolas, monospace">gpt-5.6-sol</text>
<rect x="25" y="296" width="270" height="12" rx="2" fill="#bac4b3"/>
<rect x="25" y="296" width="270.0" height="12" rx="2" fill="#a83e1b"/>
<text x="315" y="308" fill="#20261f" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">20 / 20 passed</text>
<text x="315" y="330" fill="#515e4e" font-size="13" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">0 failed</text>
<text x="25" y="383" fill="#20261f" font-size="16" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Copilot CLI 1.0.79</text>
<text x="25" y="405" fill="#515e4e" font-size="13" text-anchor="start" font-family="ui-monospace, Consolas, monospace">auto router</text>
<rect x="25" y="421" width="270" height="12" rx="2" fill="#bac4b3"/>
<rect x="25" y="421" width="270.0" height="12" rx="2" fill="#a83e1b"/>
<text x="315" y="433" fill="#20261f" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">20 / 20 passed</text>
<text x="315" y="455" fill="#515e4e" font-size="13" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">0 failed</text>
<text x="25" y="508" fill="#20261f" font-size="16" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">OpenCode CLI 1.4.0</text>
<text x="25" y="530" fill="#515e4e" font-size="13" text-anchor="start" font-family="ui-monospace, Consolas, monospace">Nemotron 3 Nano</text>
<rect x="25" y="546" width="270" height="12" rx="2" fill="#bac4b3"/>
<rect x="25" y="546" width="229.5" height="12" rx="2" fill="#a83e1b"/>

<text x="315" y="580" fill="#515e4e" font-size="13" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">3 failed</text>
<path d="M25 617H405" stroke="#bac4b3"/>
<text x="25" y="640" fill="#a83e1b" font-size="12" text-anchor="start" font-family="ui-monospace, Consolas, monospace">RECORDED RESULTS, NOT AN AGENT RANKING</text>
<text x="25" y="670" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Pass = successful exit + protected outcome</text>
<text x="25" y="691" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">verifier + deterministic anti-tampering</text>
<text x="25" y="712" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">gate.</text>
<text x="25" y="742" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Three failures: outcome verification, not</text>
<text x="25" y="763" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">tampering. Codex rows imported unchanged</text>
<text x="25" y="784" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">from eight days earlier.</text>
<text x="25" y="814" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Token usage and exact cost are unknown. Read</text>
<text x="25" y="835" fill="#515e4e" font-size="14" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">the linked methodology and limitations.</text>

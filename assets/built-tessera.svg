<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 204" role="img" aria-label="Tessera project summary" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace">
  <style>.motion { visibility: hidden; } @media (prefers-reduced-motion: no-preference) { .motion { visibility: visible; } }</style>
  <rect x="1.5" y="1.5" width="857" height="201" rx="14" fill="#0d1117" stroke="#26334a" stroke-width="1.5"/>
  <line x1="18" y1="1.5" x2="842" y2="1.5" stroke="#3fb950" stroke-width="2" opacity="0.55"/>
  <rect x="30" y="30" width="44" height="44" rx="11" fill="#3fb950" opacity="0.14"/><rect x="30" y="30" width="44" height="44" rx="11" fill="none" stroke="#3fb950" stroke-width="1.5"/><text x="52" y="52.0" text-anchor="middle" dominant-baseline="central" fill="#3fb950" font-size="23" font-weight="700">T</text>
  <text x="90" y="52.0" dominant-baseline="central" fill="#e6edf3" font-size="18" font-weight="700">Tessera</text>
  <rect x="177" y="42" width="82" height="20" rx="6" fill="#a371f7" opacity="0.14"/><rect x="177" y="42" width="82" height="20" rx="6" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.5"/><text x="218" y="56" text-anchor="middle" fill="#a371f7" font-size="10.5" font-weight="600">neuratile</text>
  <rect x="265" y="42" width="68" height="20" rx="6" fill="#a371f7" opacity="0.14"/><rect x="265" y="42" width="68" height="20" rx="6" fill="none" stroke="#a371f7" stroke-width="1" opacity="0.5"/><text x="299" y="56" text-anchor="middle" fill="#a371f7" font-size="10.5" font-weight="600">founder</text>
  <rect x="339" y="42" width="41" height="20" rx="6" fill="#e3b341" opacity="0.14"/><rect x="339" y="42" width="41" height="20" rx="6" fill="none" stroke="#e3b341" stroke-width="1" opacity="0.5"/><text x="360" y="56" text-anchor="middle" fill="#e3b341" font-size="10.5" font-weight="600">★ 5</text>
  <text x="34" y="92" font-size="12.5" fill="#8b949e">A <tspan fill="#e6edf3" font-weight="600">local-first</tspan> AI testing IDE that turns any codebase into a full QA dossier without sending source</text>
  <text x="34" y="114" font-size="12.5" fill="#8b949e">to the cloud. Parses with Tree-sitter, embeds via Ollama, generates test plans, cases and defect</text>
  <text x="34" y="136" font-size="12.5" fill="#8b949e">reports through versioned prompts with JSON-Schema tool calling, each validated by a <tspan fill="#e6edf3" font-weight="600">Zod contract</tspan>.</text>
  <rect x="34" y="164" width="89" height="20" rx="6" fill="#3178c6" opacity="0.14"/><rect x="34" y="164" width="89" height="20" rx="6" fill="none" stroke="#3178c6" stroke-width="1" opacity="0.5"/><text x="78" y="178" text-anchor="middle" fill="#3178c6" font-size="10.5" font-weight="600">TypeScript</text>
  <rect x="131" y="164" width="48" height="20" rx="6" fill="#dea584" opacity="0.14"/><rect x="131" y="164" width="48" height="20" rx="6" fill="none" stroke="#dea584" stroke-width="1" opacity="0.5"/><text x="155" y="178" text-anchor="middle" fill="#dea584" font-size="10.5" font-weight="600">Rust</text>
  <rect x="187" y="164" width="54" height="20" rx="6" fill="#24c8db" opacity="0.14"/><rect x="187" y="164" width="54" height="20" rx="6" fill="none" stroke="#24c8db" stroke-width="1" opacity="0.5"/><text x="214" y="178" text-anchor="middle" fill="#24c8db" font-size="10.5" font-weight="600">Tauri</text>
  <rect x="249" y="164" width="54" height="20" rx="6" fill="#61dafb" opacity="0.14"/><rect x="249" y="164" width="54" height="20" rx="6" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.5"/><text x="276" y="178" text-anchor="middle" fill="#61dafb" font-size="10.5" font-weight="600">React</text>
  <rect x="311" y="164" width="61" height="20" rx="6" fill="#c9d1d9" opacity="0.14"/><rect x="311" y="164" width="61" height="20" rx="6" fill="none" stroke="#c9d1d9" stroke-width="1" opacity="0.5"/><text x="342" y="178" text-anchor="middle" fill="#c9d1d9" font-size="10.5" font-weight="600">Ollama</text>
  <g aria-label="local test matrix">
    <rect x="798" y="38.0" width="11" height="11" rx="2" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950"/>
    <rect x="815" y="38.0" width="11" height="11" rx="2" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950"/>
    <rect x="798" y="55.0" width="11" height="11" rx="2" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950"/>
    <rect x="815" y="55.0" width="11" height="11" rx="2" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950"/>
    <path class="motion" d="M803 60.0L809 66.0L827 43.0" fill="none" stroke="#a7f3b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 48;48 0;48 0" keyTimes="0;0.55;1" dur="4s" repeatCount="indefinite"/>
    </path></g>
</svg>

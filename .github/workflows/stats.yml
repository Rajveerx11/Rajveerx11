name: Refresh profile assets

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "assets/contrib-heatmap.svg"
      - "assets/contrib-heatmap-static.svg"
      - "assets/contrib-heatmap-light.svg"
      - "assets/contrib-heatmap-static-light.svg"
      - "assets/stats.svg"
      - "assets/stats-static.svg"
      - "assets/project-index.svg"
      - "docs/public-repositories.md"
      - "docs/activity.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-refresh-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check generators and offline regressions
        run: |
          python -m py_compile scripts/*.py
          python -m unittest discover -s scripts -v
          python scripts/gen_atlas.py --check
          python scripts/gen_terminal.py --check
          python scripts/gen_profile.py --check
          git show --format= --check HEAD

  stats:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Generate SVGs from live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_stats.py
          python scripts/gen_projects.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg assets/contrib-heatmap-static.svg assets/contrib-heatmap-light.svg assets/contrib-heatmap-static-light.svg assets/stats.svg assets/stats-static.svg assets/project-index.svg docs/public-repositories.md docs/activity.md
          git diff --cached --quiet || git commit -m "chore: refresh generated cards"
          git push

name: Refresh profile assets

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "assets/github-stats.svg"
      - "assets/built-*.svg"
      - "assets/project-index.svg"
  workflow_dispatch:

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Generate SVGs from live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_stats.py
          python scripts/gen_built.py
          python scripts/gen_projects.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/built-*.svg assets/project-index.svg
          git diff --cached --quiet || git commit -m "chore: refresh generated cards"
          git push
